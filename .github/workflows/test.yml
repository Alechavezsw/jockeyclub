name: Tests

on:
  push:
  pull_request:

# Las publicaciones a producción van solo por deploy-edge-functions.yml (manual).
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/edge-function-guard.mjs
      - run: node scripts/deploy-edge-function.mjs --check
